[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "php84Extensions.pdo", "php84Extensions.pdo_mysql", "php84Extensions.pdo_sqlite", "php84Extensions.pdo_pgsql", "git", "curl", "libzip", "zlib"]

[phases.build]
cmds = ["composer install --no-dev --optimize-autoloader"]

[start]
cmd = "bash -c 'if [ ! -f .env ]; then cp .env.example .env; fi; mkdir -p database; [ -f database/database.sqlite ] || touch database/database.sqlite; php artisan key:generate --force || true; php artisan migrate --force || true; php artisan serve --host=0.0.0.0 --port=${PORT:-8000}'"